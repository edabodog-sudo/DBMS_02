name: Render Schema & Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  render-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Render SVG from PlantUML source
        run: plantuml -tsvg schema.puml

      - name: Create GitHub Release and upload artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" schema.svg --title "Release ${GITHUB_REF_NAME}" --notes "Automated release for ${GITHUB_REF_NAME}"
